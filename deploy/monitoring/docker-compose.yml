services:
  exporter:
    build: ../..
    environment:
      SLURM_CLUSTER: ${SLURM_CLUSTER:-production}
      HISTORY_DIR: /var/lib/slurm-insights-exporter/history
    volumes:
      - /etc/slurm:/etc/slurm:ro
      - /var/run/munge:/var/run/munge:ro
      - exporter-history:/var/lib/slurm-insights-exporter
    restart: unless-stopped
  prometheus:
    image: prom/prometheus:v3.5.0
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus", "--storage.tsdb.retention.time=90d"]
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../prometheus-rules.yaml:/etc/prometheus/rules/slurm.yaml:ro
      - prometheus-data:/prometheus
    ports: ["9090:9090"]
    restart: unless-stopped
  grafana:
    image: grafana/grafana:12.1.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ../grafana/provisioning:/etc/grafana/provisioning:ro
      - ../grafana/dashboards:/var/lib/grafana/dashboards/slurm:ro
      - grafana-data:/var/lib/grafana
    ports: ["3000:3000"]
    restart: unless-stopped
volumes:
  exporter-history:
  prometheus-data:
  grafana-data:
